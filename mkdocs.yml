# this_file: mkdocs.yml
site_name: twat-mp
site_description: Parallel processing utilities for Python — part of the twat toolkit
site_url: https://twardoch.github.io/twat-mp/
repo_url: https://github.com/twardoch/twat-mp
repo_name: twardoch/twat-mp
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API Reference: api.md
  - Style Guide: STYLE_GUIDE.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
